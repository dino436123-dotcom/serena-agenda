<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Serena — sua agenda pessoal, hábitos e metas.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=6">
  <style id="mobile-nav-style">
    /* Menu inferior (celular): pílula flutuante; só o item ativo mostra o nome.
       Fica aqui, e não no styles.css, para valer mesmo com um CSS desatualizado em cache. */
    .mobile-nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .mobile-nav button{display:flex;flex-direction:row;flex:none;align-items:center;justify-content:center;gap:7px;height:44px;min-width:44px;border:0;border-radius:999px;background:transparent;color:#fff;opacity:.62;padding:0;font-size:12px;font-weight:600;transition:background .2s,color .2s,opacity .2s}
    .mobile-nav button .l{display:none;font-size:12px;font-weight:600}
    .mobile-nav button.active{opacity:1;background:#fff;color:#000;padding:0 15px;font-weight:600}
    .mobile-nav button.active .l{display:inline}
    .mobile-nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
    @media(max-width:650px){
      .mobile-nav{display:flex;position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));top:auto;z-index:5;align-items:center;justify-content:space-between;gap:2px;padding:6px;background:#000;border:0;border-radius:999px;backdrop-filter:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}
      .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
    }
    @media(prefers-reduced-motion:reduce){.mobile-nav button{transition:none}}
  </style>
  <title>Serena — Agenda & Rotina</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Serena início">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" focusable="false"><circle cx="15" cy="20" r="8" fill="currentColor"/><circle cx="25" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
        <span><strong>serena</strong><small>agenda & rotina</small></span>
      </a>
      <div class="sidebar-date" id="sidebarDate"></div>
      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-item active" data-view="today"><span>◷</span> Meu dia</button>
        <button class="nav-item" data-view="calendar"><span>▦</span> Calendário</button>
        <button class="nav-item" data-view="tasks"><span>✓</span> Tarefas</button>
        <button class="nav-item" data-view="habits"><span>✳</span> Hábitos & metas</button>
        <button class="nav-item" data-view="reports"><span>⌁</span> Relatório semanal</button>
        <button class="nav-item" data-view="share"><span>♡</span> Compartilhar</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="privacy-dot"></span><div><strong>Seus dados são seus</strong><small>Salvos aqui e no seu espaço</small></div></div>
        <button class="text-button" id="exportBtn">↓ Exportar backup</button>
        <label class="text-button import-label">↑ Importar backup<input id="importInput" type="file" accept="application/json"></label>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" focusable="false"><circle cx="15" cy="20" r="8" fill="currentColor"/><circle cx="25" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><strong>serena</strong></div>
        <div class="topbar-note">um passo de cada vez <span>✿</span></div>
        <button class="icon-button" id="notificationBtn" title="Ativar notificações" aria-label="Ativar notificações">♧</button>
      </header>
      <section id="viewRoot" class="view-root" aria-live="polite"></section>
      <nav class="mobile-nav" aria-label="Navegação móvel">
        <button class="active" data-view="today" aria-label="Hoje"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="l">Hoje</span></button>
        <button data-view="calendar" aria-label="Agenda"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg><span class="l">Agenda</span></button>
        <button data-view="tasks" aria-label="Tarefas"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.4 2.4 4.6-5"/></svg><span class="l">Tarefas</span></button>
        <button data-view="habits" aria-label="Hábitos"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h3.5l2.5-6 4 12 2.5-6H20"/></svg><span class="l">Hábitos</span></button>
        <button data-view="reports" aria-label="Resumo"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 20V11M12 20V5M19 20v-7"/></svg><span class="l">Resumo</span></button>
      </nav>
    </main>
  </div>

  <dialog id="eventDialog" class="modal">
    <form id="eventForm" method="dialog">
      <div class="modal-head"><div><span class="eyebrow">NA SUA AGENDA</span><h2 id="eventDialogTitle">Novo compromisso</h2></div><button type="button" class="close-button" data-close="eventDialog">×</button></div>
      <input type="hidden" id="eventId">
      <label>Título<input id="eventTitle" required maxlength="100" placeholder="Ex.: Aula de pilates"></label>
      <div class="form-row"><label>Data<input id="eventDate" type="date" required></label><label>Horário<input id="eventTime" type="time"></label></div>
      <div class="form-row"><label>Categoria<select id="eventCategory"><option>Pessoal</option><option>Trabalho</option><option>Estudos</option><option>Saúde</option><option>Lazer</option><option>Casal</option></select></label><label>Lembrete<select id="eventReminder"><option value="0">Sem lembrete</option><option value="5">5 min antes</option><option value="15">15 min antes</option><option value="30">30 min antes</option><option value="60">1 hora antes</option><option value="1440">1 dia antes</option></select></label></div>
      <label>Observações<textarea id="eventNotes" rows="3" placeholder="Detalhes opcionais..."></textarea></label>
      <label class="check-line"><input type="checkbox" id="eventShared"> Quero compartilhar este compromisso</label>
      <div class="modal-actions"><button type="button" class="button button-ghost" data-close="eventDialog">Cancelar</button><button class="button button-primary" type="submit">Salvar compromisso</button></div>
    </form>
  </dialog>

  <dialog id="taskDialog" class="modal">
    <form id="taskForm" method="dialog">
      <div class="modal-head"><div><span class="eyebrow">LISTA DE TAREFAS</span><h2>Nova tarefa</h2></div><button type="button" class="close-button" data-close="taskDialog">×</button></div>
      <input type="hidden" id="taskId">
      <label>O que precisa ser feito?<input id="taskTitle" required maxlength="120" placeholder="Ex.: Organizar a semana"></label>
      <div class="form-row"><label>Prazo<input id="taskDate" type="date"></label><label>Prioridade<select id="taskPriority"><option value="low">Tranquila</option><option value="medium" selected>Importante</option><option value="high">Urgente</option></select></label></div>
      <label>Categoria<select id="taskCategory"><option>Pessoal</option><option>Trabalho</option><option>Estudos</option><option>Saúde</option><option>Casa</option></select></label>
      <label class="check-line"><input type="checkbox" id="taskProgressOn"> Acompanhar por quantidade</label>
      <div id="taskProgressFields" hidden>
        <div class="form-row"><label>Meta<input id="taskTarget" type="number" min="1" max="100000" step="1" inputmode="numeric" placeholder="Ex.: 30"></label><label>Já feito<input id="taskCurrent" type="number" min="0" max="100000" step="1" inputmode="numeric" value="0"></label></div>
        <label>Unidade<input id="taskUnit" maxlength="20" placeholder="Ex.: páginas"></label>
      </div>
      <div class="modal-actions"><button type="button" class="button button-ghost" data-close="taskDialog">Cancelar</button><button class="button button-primary" type="submit">Salvar tarefa</button></div>
    </form>
  </dialog>

  <dialog id="habitDialog" class="modal">
    <form id="habitForm" method="dialog">
      <div class="modal-head"><div><span class="eyebrow">CUIDADO COM VOCÊ</span><h2>Novo hábito</h2></div><button type="button" class="close-button" data-close="habitDialog">×</button></div>
      <label>Nome do hábito<input id="habitTitle" required maxlength="80" placeholder="Ex.: Ler por 15 minutos"></label>
      <label>Meta semanal<select id="habitGoal"><option value="1">1 vez por semana</option><option value="3">3 vezes por semana</option><option value="5" selected>5 vezes por semana</option><option value="7">Todos os dias</option></select></label>
      <div class="modal-actions"><button type="button" class="button button-ghost" data-close="habitDialog">Cancelar</button><button class="button button-primary" type="submit">Criar hábito</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
