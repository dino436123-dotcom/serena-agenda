<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Confirme seu e-mail para começar a usar a Serena Agenda.">
  <title>Confirmar e-mail · Serena</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d0f;
      --panel: #171b20;
      --panel-soft: #111519;
      --border: #293039;
      --green: #32c991;
      --green-dark: #17352d;
      --text: #f4f6f8;
      --muted: #8b95a2;
      --danger: #ff7777;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; padding: 24px;
      display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { width: min(100%, 460px); }
    .brand {
      display: flex; align-items: center; gap: 13px;
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 54px; height: 54px; flex: 0 0 54px;
      display: grid; place-items: center; border-radius: 16px;
      background: var(--green); color: #06251b;
      box-shadow: 0 8px 28px #32c99120;
    }
    .brand-name { font-size: 32px; font-weight: 760; letter-spacing: -1.4px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 28px; padding: clamp(24px, 7vw, 36px);
      box-shadow: 0 24px 70px #00000020;
    }
    .status-icon {
      width: 68px; height: 68px; border-radius: 22px;
      display: grid; place-items: center; margin-bottom: 28px;
      background: var(--green-dark); color: var(--green);
    }
    .eyebrow {
      color: var(--muted); font-size: 12px; line-height: 1.4;
      font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase;
      margin: 0 0 12px;
    }
    h1 {
      margin: 0; font-size: clamp(32px, 8vw, 43px);
      letter-spacing: -1.8px; line-height: 1.06; font-weight: 760;
    }
    .description {
      color: var(--muted); font-size: 16px; line-height: 1.65;
      margin: 16px 0 26px;
    }
    .button {
      appearance: none; border: 0; width: 100%; min-height: 58px;
      border-radius: 16px; padding: 16px 20px; display: flex;
      justify-content: center; align-items: center; gap: 10px;
      background: var(--green); color: #06251b;
      font: inherit; font-size: 16px; font-weight: 750;
      text-decoration: none; cursor: pointer; transition: transform .15s, opacity .15s;
    }
    .button:hover { opacity: .92; }
    .button:active { transform: scale(.985); }
    .button.secondary {
      background: #20262e; color: var(--text); border: 1px solid var(--border);
      margin-top: 10px;
    }
    .note {
      border: 1px solid var(--border); background: var(--panel-soft);
      border-radius: 16px; padding: 15px 16px; margin-top: 22px;
      display: flex; gap: 11px; align-items: flex-start;
      color: var(--muted); font-size: 13px; line-height: 1.55;
    }
    .note svg { flex: 0 0 auto; color: var(--green); margin-top: 1px; }
    .footer { color: #697380; text-align: center; font-size: 12px; margin: 22px 0 0; }
    .hidden { display: none !important; }
    .spinner {
      width: 22px; height: 22px; border: 2px solid #06251b55;
      border-top-color: #06251b; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand" aria-label="Serena Agenda">
      <div class="brand-mark" aria-hidden="true">
        <svg width="31" height="31" viewBox="0 0 32 32" fill="none">
          <rect x="5" y="7" width="22" height="21" rx="5" stroke="currentColor" stroke-width="2.2"/>
          <path d="M10 4v6M22 4v6M5 13h22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="m11 20 3.2 3.2 6.8-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">serena</span>
    </header>

    <section class="card" aria-live="polite">
      <div class="status-icon" id="statusIcon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
          <path d="M4 7.5 12 13l8-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="m9 14 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="eyebrow" id="eyebrow">Sua conta, seu espaço</p>
      <h1 id="heading">Confirme seu e-mail</h1>
      <p class="description" id="description">Estamos verificando o link de confirmação. Isso leva só um instante.</p>

      <a class="button hidden" id="primaryAction" href="/">Abrir Serena Agenda</a>
      <button class="button hidden" id="retryAction" type="button" onclick="location.reload()">Tentar novamente</button>
      <a class="button secondary hidden" id="secondaryAction" href="/">Voltar para a Serena</a>

      <div class="note" id="note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 11v5M12 7.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Depois da confirmação, sua conta estará pronta para você organizar compromissos, tarefas e hábitos.</span>
      </div>
    </section>
    <p class="footer">Feito com cuidado · Serena Agenda</p>
  </main>

  <!-- Configure a URL e a chave pública do seu projeto Supabase antes de publicar. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // TODO: substitua pelos dados públicos do seu projeto Supabase.
    // Nunca coloque a chave service_role/secret nesta página.
    const SUPABASE_URL = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYWx1Y2VsaWtjaGRrc2VudWtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzI2MTgsImV4cCI6MjEwNzY0ODYxOH0.uMWu9r4FnzO4DQ4UcKYmxtiEoDwPbQaKSCgPnodq3uk;
    const SUPABASE_ANON_KEY = https://jealucelikchdksenukr.supabase.co;

    const $ = (id) => document.getElementById(id);
    function showActions({ primary = true, retry = false, secondary = false } = {}) {
      $("primaryAction").classList.toggle("hidden", !primary);
      $("retryAction").classList.toggle("hidden", !retry);
      $("secondaryAction").classList.toggle("hidden", !secondary);
    }
    function setState(kind, title, message, eyebrow) {
      $("heading").textContent = title;
      $("description").textContent = message;
      $("eyebrow").textContent = eyebrow;
      $("statusIcon").innerHTML = kind === "success"
        ? '<svg width="36" height="36" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="m7.5 12.5 3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : kind === "error"
        ? '<svg width="36" height="36" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v6M12 16.5h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
        : '<div class="spinner" aria-label="Carregando"></div>';
      $("statusIcon").style.color = kind === "error" ? "var(--danger)" : "var(--green)";
      $("statusIcon").style.background = kind === "error" ? "#3b2024" : "var(--green-dark)";
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const errorCode = params.get("error_code");
      const errorDescription = params.get("error_description");
      if (errorCode || errorDescription) {
        setState("error", "Não foi possível confirmar", "Este link pode ter expirado ou já ter sido utilizado. Solicite um novo e-mail de confirmação e tente novamente.", "Link inválido ou expirado");
        showActions({ primary: false, retry: true, secondary: true });
        return;
      }

      if (SUPABASE_URL.startsWith("COLE_AQUI") || SUPABASE_ANON_KEY.startsWith("COLE_AQUI")) {
        setState("error", "Página quase pronta", "Adicione a URL e a chave publicável do Supabase neste arquivo para ativar a verificação real do link.", "Configuração necessária");
        showActions({ primary: false, retry: false, secondary: true });
        return;
      }

      try {
        const { createClient } = supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
        });

        // Links com token_hash podem chegar diretamente à página de redirecionamento.
        const tokenHash = params.get("token_hash");
        const type = params.get("type");
        if (tokenHash && type) {
          const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type });
          if (error) throw error;
        } else if (params.get("code")) {
          const { error } = await client.auth.exchangeCodeForSession(params.get("code"));
          if (error) throw error;
        }

        const { data: { session } } = await client.auth.getSession();
        if (session) {
          setState("success", "E-mail confirmado!", "Tudo certo. Sua conta Serena está pronta. Agora você pode voltar ao aplicativo e começar a organizar sua rotina.", "Boas-vindas à Serena");
          showActions({ primary: true, secondary: false });
          // Troque pela URL publicada do seu PWA, caso esta página esteja em outro endereço.
          $("primaryAction").href = "/";
          $("primaryAction").textContent = "Continuar para a Serena";
        } else {
          setState("error", "Não conseguimos validar o link", "O link não retornou uma sessão válida. Abra o e-mail mais recente de confirmação ou solicite um novo link.", "Confirmação pendente");
          showActions({ primary: false, retry: true, secondary: true });
        }
      } catch (err) {
        console.error("Falha ao confirmar e-mail:", err);
        setState("error", "Link inválido ou expirado", "Por segurança, esse link não pôde ser validado. Solicite um novo e-mail de confirmação e abra o link mais recente.", "Não foi possível concluir");
        showActions({ primary: false, retry: true, secondary: true });
      }
    }
    init();
  </script>
</body>
</html>
